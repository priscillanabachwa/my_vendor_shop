<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.6"></script>
    <script src="js/supabase-client.js"></script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #fff8f4;
        }
    </style>
    <title>Messages - DigitalVendor</title>
</head>
<body class="font-['Be_Vietnam_Pro'] text-on-surface min-h-screen">
<header class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-md border-b border-stone-100 shadow-sm flex items-center justify-between px-5 h-16">
    <h1 class="text-xl font-extrabold tracking-tight text-orange-600 font-['Plus_Jakarta_Sans']">Messages</h1>
    <button class="w-10 h-10 flex items-center justify-center rounded-full text-stone-500 hover:bg-stone-50 transition-all active:scale-95">
        <span class="material-symbols-outlined">search</span>
    </button>
</header>

<main class="pt-20 pb-24 px-5 max-w-md mx-auto">
    <div id="threadsList" class="space-y-3"></div>

    <div id="emptyMessages" class="text-center py-12 text-stone-400 hidden">
        <span class="material-symbols-outlined text-6xl text-stone-300 mb-4 block">forum</span>
        <p class="text-sm">No messages yet</p>
    </div>
</main>

<nav class="fixed bottom-0 w-full z-50 rounded-t-2xl bg-white border-t border-stone-100 shadow-[0_-4px_12px_rgba(0,0,0,0.05)] flex justify-around items-center h-20 px-2">
    <a class="flex flex-col items-center justify-center text-stone-400 px-4 py-1 hover:text-orange-500 transition-colors active:scale-90 transition-transform duration-150" href="index.html">
        <span class="material-symbols-outlined">home</span>
        <span class="font-['Plus_Jakarta_Sans'] text-[11px] font-medium">Home</span>
    </a>
    <a class="flex flex-col items-center justify-center text-stone-400 px-4 py-1 hover:text-orange-500 transition-colors active:scale-90 transition-transform duration-150" href="orders.html">
        <span class="material-symbols-outlined">receipt_long</span>
        <span class="font-['Plus_Jakarta_Sans'] text-[11px] font-medium">Orders</span>
    </a>
    <a class="flex flex-col items-center justify-center text-orange-600 bg-orange-50 rounded-xl px-4 py-1 active:scale-90 transition-transform duration-150" href="messages.html">
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">forum</span>
        <span class="font-['Plus_Jakarta_Sans'] text-[11px] font-medium">Messages</span>
    </a>
    <a class="flex flex-col items-center justify-center text-stone-400 px-4 py-1 hover:text-orange-500 transition-colors active:scale-90 transition-transform duration-150" href="profile.html">
        <span class="material-symbols-outlined">person</span>
        <span class="font-['Plus_Jakarta_Sans'] text-[11px] font-medium">Profile</span>
    </a>
</nav>

<script>
    let myId = null;

    async function init() {
        const result = await requireSession();
        if (!result) return;
        myId = result.session.user.id;
        await loadThreads();
    }

    async function loadThreads() {
        const { data: messages, error } = await window.supabaseClient
            .from('messages')
            .select('*, sender:profiles!messages_sender_id_fkey(full_name), recipient:profiles!messages_recipient_id_fkey(full_name)')
            .or(`sender_id.eq.${myId},recipient_id.eq.${myId}`)
            .order('created_at', { ascending: true });

        const listEl = document.getElementById('threadsList');
        const emptyEl = document.getElementById('emptyMessages');

        if (error || !messages || messages.length === 0) {
            listEl.innerHTML = '';
            emptyEl.classList.remove('hidden');
            return;
        }
        emptyEl.classList.add('hidden');

        const threads = new Map();
        messages.forEach(msg => {
            const iAmSender = msg.sender_id === myId;
            const partnerId = iAmSender ? msg.recipient_id : msg.sender_id;
            const partnerName = (iAmSender ? msg.recipient?.full_name : msg.sender?.full_name) || 'User';
            const unread = !iAmSender && !msg.read;
            threads.set(partnerId, { partnerId, partnerName, lastBody: msg.body, lastAt: msg.created_at, unread });
        });

        listEl.innerHTML = [...threads.values()].reverse().map(t => `
            <div class="thread bg-white rounded-2xl p-4 shadow-sm border border-stone-100 cursor-pointer hover:bg-stone-50 transition-colors flex items-center gap-3" data-partner-id="${t.partnerId}" data-partner-name="${escapeHtml(t.partnerName)}">
                <div class="w-12 h-12 rounded-full bg-orange-200 flex items-center justify-center flex-shrink-0">
                    <span class="material-symbols-outlined text-orange-600">storefront</span>
                </div>
                <div class="flex-1 min-w-0">
                    <h3 class="font-semibold text-on-surface">${escapeHtml(t.partnerName)}</h3>
                    <p class="text-sm text-stone-500 truncate">${escapeHtml(t.lastBody)}</p>
                    <p class="text-xs text-stone-400 mt-1">${new Date(t.lastAt).toLocaleString()}</p>
                </div>
                ${t.unread ? '<div class="w-2 h-2 bg-orange-600 rounded-full flex-shrink-0"></div>' : ''}
            </div>
        `).join('');

        document.querySelectorAll('.thread').forEach(el => {
            el.addEventListener('click', () => openThread(el.dataset.partnerId, el.dataset.partnerName));
        });
    }

    async function openThread(partnerId, partnerName) {
        await window.supabaseClient
            .from('messages')
            .update({ read: true })
            .eq('sender_id', partnerId)
            .eq('recipient_id', myId)
            .eq('read', false);

        const reply = prompt(`Reply to ${partnerName}:`);
        if (reply) {
            await window.supabaseClient.from('messages').insert({
                sender_id: myId,
                recipient_id: partnerId,
                body: reply
            });
        }
        await loadThreads();
    }

    init();
</script>
</body>
</html>
