<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.6"></script>
    <script src="js/supabase-client.js"></script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #fff8f4;
        }
    </style>
    <title>Shopping Cart - DigitalVendor</title>
</head>
<body class="font-['Be_Vietnam_Pro'] text-on-surface min-h-screen">
<header class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-md border-b border-stone-100 shadow-sm flex items-center justify-between px-5 h-16">
    <h1 class="text-xl font-extrabold tracking-tight text-orange-600 font-['Plus_Jakarta_Sans']">Shopping Cart</h1>
    <button id="backBtn" class="w-10 h-10 flex items-center justify-center rounded-full text-stone-500 hover:bg-stone-50 transition-all active:scale-95">
        <span class="material-symbols-outlined">arrow_back</span>
    </button>
</header>

<main class="pt-20 pb-24 px-5 max-w-md mx-auto">
    <div id="cartContainer" class="space-y-4">
        <!-- Cart items loaded here -->
    </div>
    
    <div id="emptyCart" class="text-center py-12">
        <span class="material-symbols-outlined text-6xl text-stone-300 mb-4 block">shopping_cart</span>
        <p class="text-stone-500 mb-4">Your cart is empty</p>
        <a href="index.html" class="inline-block px-6 py-3 bg-orange-600 text-white rounded-lg font-semibold hover:bg-orange-700 transition-colors">Continue Shopping</a>
    </div>

    <div id="cartSummary" class="bg-white rounded-2xl p-6 shadow-sm border border-stone-100 mt-8 hidden">
        <h3 class="font-semibold text-lg mb-4">Order Summary</h3>
        <div class="space-y-3 mb-4">
            <div class="flex justify-between text-stone-600">
                <span>Subtotal</span>
                <span id="subtotal">$0.00</span>
            </div>
            <div class="flex justify-between text-stone-600">
                <span>Shipping</span>
                <span>$5.00</span>
            </div>
            <div class="flex justify-between text-stone-600">
                <span>Tax</span>
                <span id="tax">$0.00</span>
            </div>
            <div class="border-t pt-3 flex justify-between font-semibold text-lg">
                <span>Total</span>
                <span id="total">$0.00</span>
            </div>
        </div>
        <button id="checkoutBtn" class="w-full py-3 bg-orange-600 text-white rounded-lg font-semibold hover:bg-orange-700 transition-colors">
            Proceed to Checkout
        </button>
    </div>
</main>

<!-- Navigation Bar -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-2xl bg-white border-t border-stone-100 shadow-[0_-4px_12px_rgba(0,0,0,0.05)] flex justify-around items-center h-20 px-2">
    <a class="flex flex-col items-center justify-center text-stone-400 px-4 py-1 hover:text-orange-500 transition-colors active:scale-90 transition-transform duration-150" href="index.html">
        <span class="material-symbols-outlined">home</span>
        <span class="font-['Plus_Jakarta_Sans'] text-[11px] font-medium">Home</span>
    </a>
    <a class="flex flex-col items-center justify-center text-stone-400 px-4 py-1 hover:text-orange-500 transition-colors active:scale-90 transition-transform duration-150" href="orders.html">
        <span class="material-symbols-outlined">receipt_long</span>
        <span class="font-['Plus_Jakarta_Sans'] text-[11px] font-medium">Orders</span>
    </a>
    <a class="flex flex-col items-center justify-center text-stone-400 px-4 py-1 hover:text-orange-500 transition-colors active:scale-90 transition-transform duration-150" href="messages.html">
        <span class="material-symbols-outlined">forum</span>
        <span class="font-['Plus_Jakarta_Sans'] text-[11px] font-medium">Messages</span>
    </a>
    <a class="flex flex-col items-center justify-center text-stone-400 px-4 py-1 hover:text-orange-500 transition-colors active:scale-90 transition-transform duration-150" href="profile.html">
        <span class="material-symbols-outlined">person</span>
        <span class="font-['Plus_Jakarta_Sans'] text-[11px] font-medium">Profile</span>
    </a>
</nav>

<script>
    let currentUser = null;
    let cart = [];

    async function init() {
        const result = await requireSession();
        if (!result) return;
        currentUser = result.session.user;
        cart = JSON.parse(localStorage.getItem('cart')) || [];
        renderCart();
    }

    function renderCart() {
        const container = document.getElementById('cartContainer');
        const summary = document.getElementById('cartSummary');
        const emptyCart = document.getElementById('emptyCart');

        if (cart.length === 0) {
            container.innerHTML = '';
            summary.classList.add('hidden');
            emptyCart.classList.remove('hidden');
            return;
        }

        emptyCart.classList.add('hidden');
        summary.classList.remove('hidden');

        container.innerHTML = cart.map((item, index) => `
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-stone-100 flex gap-4">
                <div class="w-24 h-24 flex items-center justify-center text-4xl bg-orange-50 rounded-lg">${escapeHtml(item.icon || '🛍️')}</div>
                <div class="flex-1">
                    <h3 class="font-semibold mb-1">${escapeHtml(item.name)}</h3>
                    <div class="flex items-center justify-between">
                        <span class="text-orange-600 font-bold">$${item.price.toFixed(2)}</span>
                        <div class="flex items-center gap-2">
                            <button class="qty-btn decrease px-2 py-1 bg-stone-100 rounded hover:bg-stone-200" data-index="${index}">−</button>
                            <span class="w-6 text-center">${item.quantity}</span>
                            <button class="qty-btn increase px-2 py-1 bg-stone-100 rounded hover:bg-stone-200" data-index="${index}">+</button>
                        </div>
                        <button class="remove-btn text-error hover:text-red-700" data-index="${index}">
                            <span class="material-symbols-outlined">delete</span>
                        </button>
                    </div>
                </div>
            </div>
        `).join('');

        // Event listeners for cart buttons
        document.querySelectorAll('.qty-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const index = parseInt(btn.dataset.index);
                if (btn.classList.contains('increase')) {
                    cart[index].quantity++;
                } else if (cart[index].quantity > 1) {
                    cart[index].quantity--;
                }
                localStorage.setItem('cart', JSON.stringify(cart));
                renderCart();
            });
        });

        document.querySelectorAll('.remove-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const index = parseInt(btn.dataset.index);
                cart.splice(index, 1);
                localStorage.setItem('cart', JSON.stringify(cart));
                renderCart();
            });
        });

        // Update summary
        updateSummary();
    }

    function updateSummary() {
        const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        const shipping = 5.00;
        const tax = subtotal * 0.1;
        const total = subtotal + shipping + tax;

        document.getElementById('subtotal').textContent = `$${subtotal.toFixed(2)}`;
        document.getElementById('tax').textContent = `$${tax.toFixed(2)}`;
        document.getElementById('total').textContent = `$${total.toFixed(2)}`;
    }

    // Back button
    document.getElementById('backBtn').addEventListener('click', () => {
        window.location.href = 'index.html';
    });

    document.getElementById('checkoutBtn').addEventListener('click', async () => {
        if (cart.length === 0 || !currentUser) return;

        const checkoutBtn = document.getElementById('checkoutBtn');
        checkoutBtn.disabled = true;
        checkoutBtn.textContent = 'Placing order...';

        const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        const total = subtotal + 5.00 + (subtotal * 0.1);

        const { data: order, error: orderError } = await window.supabaseClient
            .from('orders')
            .insert({ buyer_id: currentUser.id, total, status: 'pending' })
            .select()
            .single();

        if (orderError) {
            alert('Could not place order: ' + orderError.message);
            checkoutBtn.disabled = false;
            checkoutBtn.textContent = 'Proceed to Checkout';
            return;
        }

        const items = cart.map(item => ({
            order_id: order.id,
            product_id: item.id,
            vendor_id: item.vendorId,
            quantity: item.quantity,
            price: item.price
        }));

        const { error: itemsError } = await window.supabaseClient.from('order_items').insert(items);

        if (itemsError) {
            alert('Could not save order items: ' + itemsError.message);
            checkoutBtn.disabled = false;
            checkoutBtn.textContent = 'Proceed to Checkout';
            return;
        }

        localStorage.removeItem('cart');
        window.location.href = 'orders.html';
    });

    init();
</script>
</body>
</html>
