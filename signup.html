<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Sign Up - DigitalVendor</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script async src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.6/+esm"></script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #fff8f4;
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="font-body-md text-on-surface selection:bg-primary-fixed">
<main class="min-h-screen flex flex-col items-center justify-center px-5 py-8">
    <div class="w-full max-w-md flex flex-col items-center">
        <header class="mb-8 text-center">
            <div class="w-16 h-16 bg-[#f27024] rounded-2xl flex items-center justify-center mb-4 mx-auto shadow-lg">
                <span class="material-symbols-outlined text-white text-4xl">storefront</span>
            </div>
            <h1 class="text-2xl font-bold text-[#a04100] tracking-tight">Create Account</h1>
            <p class="text-sm text-[#584238] mt-2">Join DigitalVendor today</p>
        </header>

        <div id="alertContainer" class="w-full mb-4"></div>

        <section class="w-full bg-white rounded-3xl p-6 border border-stone-100 shadow-sm">
            <form id="signupForm" class="space-y-6">
                <div class="space-y-2">
                    <label class="text-sm font-semibold text-[#584238]" for="fullName">Full Name</label>
                    <input class="w-full h-14 px-4 bg-[#faf2ed] border-none rounded-xl font-base text-on-surface focus:ring-2 focus:ring-[#f27024] transition-all" id="fullName" placeholder="Your full name" type="text" required/>
                </div>
                <div class="space-y-2">
                    <label class="text-sm font-semibold text-[#584238]" for="signupEmail">Email Address</label>
                    <input class="w-full h-14 px-4 bg-[#faf2ed] border-none rounded-xl font-base text-on-surface focus:ring-2 focus:ring-[#f27024] transition-all" id="signupEmail" placeholder="your@email.com" type="email" required/>
                </div>
                <div class="space-y-2">
                    <label class="text-sm font-semibold text-[#584238]" for="signupPassword">Password</label>
                    <input class="w-full h-14 px-4 bg-[#faf2ed] border-none rounded-xl font-base text-on-surface focus:ring-2 focus:ring-[#f27024] transition-all" id="signupPassword" placeholder="••••••••" type="password" required/>
                </div>
                <div class="space-y-2">
                    <label class="text-sm font-semibold text-[#584238]" for="confirmPassword">Confirm Password</label>
                    <input class="w-full h-14 px-4 bg-[#faf2ed] border-none rounded-xl font-base text-on-surface focus:ring-2 focus:ring-[#f27024] transition-all" id="confirmPassword" placeholder="••••••••" type="password" required/>
                </div>
                <button class="w-full h-14 bg-[#a04100] text-white font-bold rounded-xl shadow-lg hover:bg-opacity-90 transition-all" type="submit">
                    Create Account
                </button>
            </form>
        </section>

        <footer class="mt-8 text-center">
            <p class="text-sm text-[#584238]">
                Already have an account? 
                <a class="text-[#a04100] font-semibold hover:underline ml-1" href="login.html">Login</a>
            </p>
        </footer>
    </div>
</main>

<div class="fixed top-0 left-0 w-full h-full pointer-events-none -z-10 opacity-40 overflow-hidden">
    <div class="absolute top-[-10%] right-[-10%] w-[50%] h-[50%] bg-[#f27024] rounded-full blur-[120px] opacity-20"></div>
    <div class="absolute bottom-[-5%] left-[-5%] w-[40%] h-[40%] bg-[#78a16f] rounded-full blur-[100px] opacity-15"></div>
</div>

<script>
    // DEMO MODE - Signup works with localStorage
    let supabase = null;

    function showAlert(message, type = 'error') {
        const alertContainer = document.getElementById('alertContainer');
        const bgColor = type === 'success' ? 'bg-green-100' : 'bg-red-100';
        const textColor = type === 'success' ? 'text-green-800' : 'text-red-800';
        const borderColor = type === 'success' ? 'border-green-300' : 'border-red-300';
        
        const alert = document.createElement('div');
        alert.className = `${bgColor} ${textColor} ${borderColor} border rounded-xl p-4 text-sm`;
        alert.textContent = message;
        
        alertContainer.innerHTML = '';
        alertContainer.appendChild(alert);
        
        setTimeout(() => {
            alert.remove();
        }, 5000);
    }

    const signupForm = document.getElementById('signupForm');
    signupForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const fullName = document.getElementById('fullName').value;
        const email = document.getElementById('signupEmail').value;
        const password = document.getElementById('signupPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password !== confirmPassword) {
            showAlert('Passwords do not match!');
            return;
        }

        if (password.length < 6) {
            showAlert('Password must be at least 6 characters long!');
            return;
        }

        const submitBtn = signupForm.querySelector('button');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Creating account...';

        try {
            // DEMO MODE: Store account in localStorage
            const accounts = JSON.parse(localStorage.getItem('demoAccounts') || '{}');
            
            if (accounts[email]) {
                showAlert('This email is already registered!');
            } else {
                accounts[email] = password;
                localStorage.setItem('demoAccounts', JSON.stringify(accounts));
                
                showAlert('Account created successfully! Redirecting to login...', 'success');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            }
        } catch (error) {
            showAlert(error.message || 'Failed to create account.');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Create Account';
        }
    });
</script>
</body>
</html>
