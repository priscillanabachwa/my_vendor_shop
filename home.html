    <title>Home - DigitalVendor</title>

<body class="bg-background text-on-surface min-h-screen">
<header class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-md border-b border-stone-100 shadow-sm flex items-center justify-between px-5 h-16">
    <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center overflow-hidden">
            <img id="headerProfileImg" alt="User Profile" class="w-full h-full object-cover" src=""/>
        </div>
        <span class="text-xl font-extrabold tracking-tight text-orange-600 headline-font">DigitalVendor</span>
    </div>
    <button id="searchBtn" class="w-10 h-10 flex items-center justify-center rounded-full text-stone-500 hover:bg-stone-50 transition-all duration-200 active:scale-95">
        <span class="material-symbols-outlined" data-icon="search">search</span>
    </button>
</header>

<main class="pt-20 pb-24 px-5 max-w-md mx-auto">
    <div class="relative mb-6">
        <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
            <span class="material-symbols-outlined text-outline" data-icon="search">search</span>
        </div>
        <input id="searchInput" class="w-full h-14 pl-12 pr-4 bg-surface-container-low border-none rounded-xl text-body-md font-body-md focus:ring-2 focus:ring-primary shadow-sm" placeholder="Search products or vendors..." type="text"/>
    </div>

    <!-- Categories Section -->
    <section class="mb-8">
        <div class="flex items-center justify-between mb-4">
            <h2 class="font-headline-md text-headline-md text-on-surface">Categories</h2>
            <button id="viewAllCategoriesBtn" class="text-label-lg font-label-lg text-primary hover:text-orange-700 transition-colors">View all</button>
        </div>
        <div class="grid grid-cols-4 gap-3">
            <button class="category-btn flex flex-col items-center gap-2 active:scale-90 transition-transform" data-category="food">
                <div class="w-16 h-16 rounded-2xl bg-orange-100 flex items-center justify-center text-orange-700 shadow-sm">
                    <span class="material-symbols-outlined text-3xl" data-icon="restaurant">restaurant</span>
                </div>
                <span class="text-label-md font-label-md text-on-surface-variant">Food</span>
            </button>
            <button class="category-btn flex flex-col items-center gap-2 active:scale-90 transition-transform" data-category="clothes">
                <div class="w-16 h-16 rounded-2xl bg-blue-50 flex items-center justify-center text-blue-700 shadow-sm">
                    <span class="material-symbols-outlined text-3xl" data-icon="apparel">apparel</span>
                </div>
                <span class="text-label-md font-label-md text-on-surface-variant">Clothes</span>
            </button>
            <button class="category-btn flex flex-col items-center gap-2 active:scale-90 transition-transform" data-category="electronics">
                <div class="w-16 h-16 rounded-2xl bg-purple-50 flex items-center justify-center text-purple-700 shadow-sm">
                    <span class="material-symbols-outlined text-3xl" data-icon="devices">devices</span>
                </div>
                <span class="text-label-md font-label-md text-on-surface-variant">Electronics</span>
            </button>
            <button class="category-btn flex flex-col items-center gap-2 active:scale-90 transition-transform" data-category="produce">
                <div class="w-16 h-16 rounded-2xl bg-green-50 flex items-center justify-center text-green-700 shadow-sm">
                    <span class="material-symbols-outlined text-3xl" data-icon="potted_plant">potted_plant</span>
                </div>
                <span class="text-label-md font-label-md text-on-surface-variant">Produce</span>
            </button>
        </div>
    </section>

    <!-- Nearby Deals Section -->
    <section class="mb-8">
        <h2 class="font-headline-md text-headline-md text-on-surface mb-4">Nearby Deals</h2>
        <div id="productsGrid" class="grid grid-cols-2 gap-4">
            <!-- Products loaded dynamically -->
        </div>
    </section>
</main>

<!-- Cart Button -->
<button id="cartBtn" class="fixed right-6 bottom-24 w-16 h-16 rounded-full bg-primary-container text-white shadow-xl flex items-center justify-center z-40 active:scale-90 transition-transform hover:shadow-2xl relative">
    <span class="material-symbols-outlined text-3xl" data-icon="add_circle" style="font-variation-settings: 'FILL' 1;">add_circle</span>
    <div id="cartBadge" class="absolute top-0 right-0 w-6 h-6 bg-error rounded-full flex items-center justify-center text-white text-xs font-bold hidden">
        <span id="cartCount">0</span>
    </div>
</button>

<!-- Navigation Bar -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-2xl bg-white border-t border-stone-100 shadow-[0_-4px_12px_rgba(0,0,0,0.05)] flex justify-around items-center h-20 px-2">
    <a id="homeNav" class="flex flex-col items-center justify-center text-orange-600 bg-orange-50 rounded-xl px-4 py-1 active:scale-90 transition-transform duration-150" href="home.html">
        <span class="material-symbols-outlined" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
        <span class="headline-font text-[11px] font-medium">Home</span>
    </a>
    <a id="ordersNav" class="flex flex-col items-center justify-center text-stone-400 px-4 py-1 hover:text-orange-500 transition-colors active:scale-90 transition-transform duration-150" href="orders.html">
        <span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
        <span class="headline-font text-[11px] font-medium">Orders</span>
    </a>
    <a id="messagesNav" class="flex flex-col items-center justify-center text-stone-400 px-4 py-1 hover:text-orange-500 transition-colors active:scale-90 transition-transform duration-150 relative" href="messages.html">
        <span class="material-symbols-outlined" data-icon="forum">forum</span>
        <span class="headline-font text-[11px] font-medium">Messages</span>
        <div id="messagesBadge" class="absolute top-1 right-5 w-2 h-2 bg-error rounded-full"></div>
    </a>
    <a id="profileNav" class="flex flex-col items-center justify-center text-stone-400 px-4 py-1 hover:text-orange-500 transition-colors active:scale-90 transition-transform duration-150" href="profile.html">
        <span class="material-symbols-outlined" data-icon="person">person</span>
        <span class="headline-font text-[11px] font-medium">Profile</span>
    </a>
</nav>

<script>
    // DEMO MODE - Check for logged-in user
    
    // Check authentication
    function checkAuth() {
        const demoUser = localStorage.getItem('demoUser');
        if (!demoUser) {
            window.location.href = 'login.html';
        }
    }
    
    // Run auth check on page load
    checkAuth();
    function loadUserProfile(user) {
        const initials = user.email?.charAt(0).toUpperCase() || 'U';
        document.getElementById('headerProfileImg').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(user.email)}&background=f27024&color=fff`;
    }

    // Mock products data
    const products = [
        { id: 1, name: 'Organic Produce Box', price: 24.00, location: 'Downtown Market', category: 'produce', image: 'https://lh3.googleusercontent.com/aida-public/AB6AXuB_aOouW8cT9Dc0G1mkKKwXX2s55lHVArEI3c7gpwjicrxl9Di7fC0p8rtaKJXfIY0BrvrZ_selMzscprioZZZVZydIzA_m7swJw1O8xeHWYjthka7453LHIJYgWVhEpTRSyCwI31nw9gRXCBZPw8D72sr-m-dZ0BLMWo-H7rGsbdaKVJOd1rHIXlFB0_CaRS1udb5R7vsCCfeHAKgWmFpG8hnvpQsJOYaOAfiBCT85ilKrCI1SSLNjjzV2VqdPPl4PBVHifvIPzaA', verified: true },
        { id: 2, name: 'Smart Watch S2', price: 199.99, location: 'Tech Hub Plaza', category: 'electronics', image: 'https://lh3.googleusercontent.com/aida-public/AB6AXuDIfyuclnQAZJWPRxulDd9hM63jo0BWrT7oLBDFHAGoxLVWR-_cE8jZPQxEulKLo53WHeAbkGQ4LQREFoRU4VN_sRKve1ms6IIsJjXyC05Xo1_BLE8Smg0bl3pNHP_HRKfJ7y_FzrGruuT_ZOCJjHD09nvS5rgQBKWEsEbeGihrOqkubAAdXcOVAFzaZNKLJ2W_0flhGJUFVkACJTh9wNcGkRfO4cQzS8PM95OX5WWvnYQ49riczttB4W_UBTjRgUzXmQM8hB2SG90', verified: false },
        { id: 3, name: 'Core i7 Laptop', price: 850.00, location: 'Silicon Street', category: 'electronics', image: 'https://lh3.googleusercontent.com/aida-public/AB6AXuBkA4kxoPVrHthm0lLxkwJqCVCba3feRRbGSvJmMpRO8L_a6rdU1WxVbPgeYyvo0Gk9sPP-0yd_JcnLR8UCndOAEkI4EOCgWtqPwsR5EQo-mjIf6mEi_afFKVNAj3iCdAQ2vBvVHrjWT4TAkwrE4ZW_Tn8fYXdJ-f6VN43uQwEo0_lySNwslmzWlQFDQRcAioORIVlscN0gtqy3f4LOMV3M7twFqjca-xWJOuMZEkx5JdEftDBgHdMQl6eixBU8mVUwrgvLOnITTwE', verified: false },
        { id: 4, name: 'Essentials T-Shirt', price: 25.00, location: 'Boutique Lane', category: 'clothes', image: 'https://lh3.googleusercontent.com/aida-public/AB6AXuAFHdHL4laarqfjfqfoGSFeqwQIPgwA-HE8ZTO6loxtYipWutVP09wQwzArSwFaNYq_j0Zm-eCn4aQ7JoxSeN0_wniiVjT8s4_mbqOnPXB4o_QL3SWjfXmuQZfr1eY-HzjgaymCiW3WLWCX_1KgRhHVCHX2oCYgbDguNR4X-L8aESDPfcq1P7X-eB-4YDxBpoC6QmyZ8b2fjMu9EU1w6q-iqRAIAREEoEafZi5dAVsIcTqO_0owlAP2lseunPiXTBHifTYEUdQqroA', verified: true },
    ];

    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    let selectedCategory = null;

    // Render products
    function renderProducts(filteredProducts = products) {
        const grid = document.getElementById('productsGrid');
        grid.innerHTML = filteredProducts.map(product => `
            <div class="bg-white rounded-2xl overflow-hidden shadow-[0_4px_12px_rgba(0,0,0,0.05)] border border-stone-100 group">
                <div class="relative h-40 overflow-hidden">
                    <img alt="${product.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" src="${product.image}"/>
                    ${product.verified ? '<div class="absolute top-2 right-2 px-2 py-1 bg-tertiary-fixed text-on-tertiary-fixed rounded-lg text-[10px] font-bold uppercase tracking-wider flex items-center gap-1"><span class="material-symbols-outlined text-[12px]" style="font-variation-settings: \'FILL\' 1;">verified</span>Verified</div>' : ''}
                </div>
                <div class="p-3">
                    <h3 class="font-label-lg text-label-lg text-on-surface mb-1 truncate">${product.name}</h3>
                    <div class="flex items-center gap-1 text-on-surface-variant mb-2">
                        <span class="material-symbols-outlined text-sm" data-icon="location_on">location_on</span>
                        <span class="text-[10px] font-medium">${product.location}</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-primary font-bold text-lg">$${product.price.toFixed(2)}</span>
                        <button class="add-to-cart-btn w-8 h-8 rounded-full bg-primary-container text-white flex items-center justify-center active:scale-90 transition-transform hover:bg-opacity-90" data-product-id="${product.id}">
                            <span class="material-symbols-outlined text-sm" data-icon="add">add</span>
                        </button>
                    </div>
                </div>
            </div>
        `).join('');

        document.querySelectorAll('.add-to-cart-btn').forEach(btn => {
            btn.addEventListener('click', () => addToCart(parseInt(btn.dataset.productId)));
        });
    }

    // Add to cart
    function addToCart(productId) {
        const product = products.find(p => p.id === productId);
        const existingItem = cart.find(item => item.id === productId);
        
        if (existingItem) {
            existingItem.quantity++;
        } else {
            cart.push({ ...product, quantity: 1 });
        }
        
        localStorage.setItem('cart', JSON.stringify(cart));
        updateCartBadge();
        showNotification(`${product.name} added to cart!`);
    }

    // Update cart badge
    function updateCartBadge() {
        const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
        const badge = document.getElementById('cartBadge');
        const count = document.getElementById('cartCount');
        count.textContent = totalItems;
        badge.classList.toggle('hidden', totalItems === 0);
    }

    // Show notification
    function showNotification(message) {
        const notification = document.createElement('div');
        notification.className = 'fixed top-20 left-1/2 -translate-x-1/2 bg-green-500 text-white px-4 py-2 rounded-lg shadow-lg z-40';
        notification.textContent = message;
        document.body.appendChild(notification);
        setTimeout(() => notification.remove(), 2000);
    }

    // Category filtering
    document.querySelectorAll('.category-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            selectedCategory = btn.dataset.category;
            const filtered = products.filter(p => p.category === selectedCategory);
            renderProducts(filtered);
        });
    });

    // Cart button
    document.getElementById('cartBtn').addEventListener('click', () => {
        if (cart.length > 0) {
            window.location.href = 'cart.html';
        } else {
            showNotification('Your cart is empty');
        }
    });

    // View all categories
    document.getElementById('viewAllCategoriesBtn').addEventListener('click', () => {
        selectedCategory = null;
        renderProducts();
    });

    // Search
    document.getElementById('searchInput').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        const filtered = products.filter(p => 
            p.name.toLowerCase().includes(query) || 
            p.location.toLowerCase().includes(query)
        );
        renderProducts(filtered);
    });

    // Initial render
    renderProducts();
    updateCartBadge();
</script>
</body>
</html>
