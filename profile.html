<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.6"></script>
    <script src="js/supabase-client.js"></script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #fff8f4;
            color: #1e1b18;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
    <script src="js/tailwind-config.js"></script>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
    <title>Profile - DigitalVendor</title>
</head>
<body class="font-body-md">
<header class="bg-white/80 backdrop-blur-md fixed top-0 w-full z-50 border-b border-stone-100 shadow-sm flex items-center justify-between px-5 h-16">
    <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-surface-container overflow-hidden flex items-center justify-center">
            <img id="headerProfile" alt="User Profile" class="w-full h-full object-cover" src=""/>
        </div>
        <h1 class="font-['Plus_Jakarta_Sans'] font-semibold text-xl font-extrabold tracking-tight text-orange-600">DigitalVendor</h1>
    </div>
    <button id="searchBtn" class="p-2 rounded-full hover:bg-stone-50 transition-all duration-200 active:scale-95 text-stone-500">
        <span class="material-symbols-outlined" data-icon="search">search</span>
    </button>
</header>

<main class="pt-20 pb-28 px-5 max-w-md mx-auto">
    <!-- Profile Header Section -->
    <section class="mb-6">
        <div class="bg-white rounded-xl p-4 shadow-[0_4px_12px_rgba(0,0,0,0.05)] border border-outline-variant/30 flex items-center gap-4">
            <div class="relative">
                <img id="profileImage" class="w-20 h-20 rounded-full object-cover border-2 border-primary-container" src=""/>
                <div class="absolute bottom-0 right-0 bg-tertiary-container text-white p-1 rounded-full border-2 border-white">
                    <span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">verified</span>
                </div>
            </div>
            <div>
                <h2 id="profileName" class="font-headline-md text-headline-md text-on-surface">Loading...</h2>
                <p id="profileEmail" class="font-body-sm text-body-sm text-on-surface-variant"></p>
                <div class="mt-2 inline-flex items-center px-2 py-0.5 rounded-full bg-secondary-container/20 text-on-secondary-container">
                    <span id="profileRole" class="font-label-md text-label-md capitalize"></span>
                </div>
            </div>
        </div>
    </section>

    <!-- Settings List -->
    <div class="space-y-3">
        <h3 class="font-label-lg text-label-lg text-on-surface-variant px-1 uppercase tracking-wider">Account Settings</h3>
        <div class="bg-white rounded-xl shadow-[0_4px_12px_rgba(0,0,0,0.05)] border border-outline-variant/20 overflow-hidden">
            
            <!-- Edit Profile -->
            <button id="editProfileBtn" class="w-full flex items-center justify-between p-4 hover:bg-surface-container-low transition-colors group">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-lg bg-primary-container/10 flex items-center justify-center text-primary">
                        <span class="material-symbols-outlined" data-icon="person">person</span>
                    </div>
                    <span class="font-label-lg text-label-lg text-on-surface">Edit Profile</span>
                </div>
                <span class="material-symbols-outlined text-outline/50 group-hover:translate-x-1 transition-transform" data-icon="chevron_right">chevron_right</span>
            </button>
            <div class="h-px bg-outline-variant/20 mx-4"></div>

            <!-- Payment Methods -->
            <button id="paymentMethodsBtn" class="w-full flex items-center justify-between p-4 hover:bg-surface-container-low transition-colors group">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-lg bg-secondary-container/10 flex items-center justify-center text-secondary">
                        <span class="material-symbols-outlined" data-icon="payments">payments</span>
                    </div>
                    <span class="font-label-lg text-label-lg text-on-surface">Payment Methods</span>
                </div>
                <span class="material-symbols-outlined text-outline/50 group-hover:translate-x-1 transition-transform" data-icon="chevron_right">chevron_right</span>
            </button>
            <div class="h-px bg-outline-variant/20 mx-4"></div>

            <!-- Notifications -->
            <button id="notificationsBtn" class="w-full flex items-center justify-between p-4 hover:bg-surface-container-low transition-colors group">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-lg bg-tertiary-container/10 flex items-center justify-center text-tertiary">
                        <span class="material-symbols-outlined" data-icon="notifications">notifications</span>
                    </div>
                    <span class="font-label-lg text-label-lg text-on-surface">Notifications</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="material-symbols-outlined text-outline/50 group-hover:translate-x-1 transition-transform" data-icon="chevron_right">chevron_right</span>
                </div>
            </button>
        </div>

        <h3 class="font-label-lg text-label-lg text-on-surface-variant px-1 pt-4 uppercase tracking-wider">Preferences & Help</h3>
        <div class="bg-white rounded-xl shadow-[0_4px_12px_rgba(0,0,0,0.05)] border border-outline-variant/20 overflow-hidden">
            
            <!-- Language -->
            <button id="languageBtn" class="w-full flex items-center justify-between p-4 hover:bg-surface-container-low transition-colors group">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-lg bg-surface-container-highest/30 flex items-center justify-center text-on-surface-variant">
                        <span class="material-symbols-outlined" data-icon="language">language</span>
                    </div>
                    <span class="font-label-lg text-label-lg text-on-surface">Language</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="font-body-sm text-body-sm text-outline">English</span>
                    <span class="material-symbols-outlined text-outline/50 group-hover:translate-x-1 transition-transform" data-icon="chevron_right">chevron_right</span>
                </div>
            </button>
            <div class="h-px bg-outline-variant/20 mx-4"></div>

            <!-- Help & Support -->
            <button id="helpBtn" class="w-full flex items-center justify-between p-4 hover:bg-surface-container-low transition-colors group">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-lg bg-surface-container-highest/30 flex items-center justify-center text-on-surface-variant">
                        <span class="material-symbols-outlined" data-icon="help">help</span>
                    </div>
                    <span class="font-label-lg text-label-lg text-on-surface">Help & Support</span>
                </div>
                <span class="material-symbols-outlined text-outline/50 group-hover:translate-x-1 transition-transform" data-icon="chevron_right">chevron_right</span>
            </button>
        </div>

        <!-- Switch to Vendor Mode (buyers only) -->
        <button id="switchToVendorBtn" class="w-full mt-6 hidden items-center justify-center gap-2 p-4 bg-primary-container/10 border border-primary/10 text-primary rounded-xl font-label-lg text-label-lg hover:bg-primary-container/20 transition-all active:scale-[0.98]">
            <span class="material-symbols-outlined" data-icon="storefront">storefront</span>
            Switch to Vendor Mode
        </button>

        <!-- Logout -->
        <button id="logoutBtn" class="w-full mt-3 flex items-center justify-center gap-2 p-4 bg-error-container/20 border border-error/10 text-error rounded-xl font-label-lg text-label-lg hover:bg-error-container/30 transition-all active:scale-[0.98]">
            <span class="material-symbols-outlined" data-icon="logout">logout</span>
            Logout
        </button>

        <!-- Version Tag -->
        <div class="text-center pt-4">
            <p class="font-label-md text-label-md text-outline/40">DigitalVendor v2.4.0 (Enterprise)</p>
        </div>
    </div>
</main>

<!-- Navigation Bar -->
<nav class="bg-white fixed bottom-0 w-full z-50 rounded-t-2xl border-t border-stone-100 shadow-[0_-4px_12px_rgba(0,0,0,0.05)] flex justify-around items-center h-20 px-2">
    <a id="homeNav" class="flex flex-col items-center justify-center text-stone-400 px-4 py-1 hover:text-orange-500 transition-colors active:scale-90 transition-transform duration-150" href="index.html">
        <span class="material-symbols-outlined" data-icon="home">home</span>
        <span class="font-['Plus_Jakarta_Sans'] text-[11px] font-medium">Home</span>
    </a>
    <a id="ordersNav" class="flex flex-col items-center justify-center text-stone-400 px-4 py-1 hover:text-orange-500 transition-colors active:scale-90 transition-transform duration-150" href="orders.html">
        <span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
        <span class="font-['Plus_Jakarta_Sans'] text-[11px] font-medium">Orders</span>
    </a>
    <a id="messagesNav" class="flex flex-col items-center justify-center text-stone-400 px-4 py-1 hover:text-orange-500 transition-colors active:scale-90 transition-transform duration-150" href="messages.html">
        <span class="material-symbols-outlined" data-icon="forum">forum</span>
        <span class="font-['Plus_Jakarta_Sans'] text-[11px] font-medium">Messages</span>
    </a>
    <a id="profileNav" class="flex flex-col items-center justify-center text-orange-600 bg-orange-50 rounded-xl px-4 py-1 active:scale-90 transition-transform duration-150" href="profile.html">
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
        <span class="font-['Plus_Jakarta_Sans'] text-[11px] font-medium">Profile</span>
    </a>
</nav>

<script>
    let currentProfile = null;

    async function init() {
        const result = await requireSession();
        if (!result) return;
        currentProfile = result.profile;
        loadUserProfile(result.session.user, result.profile);
    }

    function loadUserProfile(user, profile) {
        const userName = profile.full_name || user.email || 'User';
        const avatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(userName)}&background=f27024&color=fff`;

        document.getElementById('profileName').textContent = userName;
        document.getElementById('profileEmail').textContent = user.email;
        document.getElementById('profileRole').textContent = profile.role;
        document.getElementById('profileImage').src = avatar;
        document.getElementById('headerProfile').src = avatar;

        if (profile.role === 'buyer') {
            const switchBtn = document.getElementById('switchToVendorBtn');
            switchBtn.classList.remove('hidden');
            switchBtn.classList.add('flex');
        }
    }

    init();

    document.getElementById('switchToVendorBtn').addEventListener('click', async () => {
        if (!confirm('Switch your account to Vendor mode?')) return;

        const { error } = await window.supabaseClient
            .from('profiles')
            .update({ role: 'vendor' })
            .eq('id', currentProfile.id);

        if (error) {
            alert('Could not switch roles: ' + error.message);
            return;
        }
        window.location.href = 'vendor-dashboard.html';
    });

    // Edit Profile
    document.getElementById('editProfileBtn').addEventListener('click', async () => {
        const newName = prompt('Full name:', currentProfile?.full_name || '');
        if (!newName) return;

        const { error } = await window.supabaseClient
            .from('profiles')
            .update({ full_name: newName })
            .eq('id', currentProfile.id);

        if (error) {
            alert('Could not update profile: ' + error.message);
        } else {
            currentProfile.full_name = newName;
            document.getElementById('profileName').textContent = newName;
        }
    });

    // Payment Methods
    document.getElementById('paymentMethodsBtn').addEventListener('click', () => {
        alert('Payment Methods management coming soon!');
    });

    // Notifications
    document.getElementById('notificationsBtn').addEventListener('click', () => {
        window.location.href = 'messages.html';
    });

    // Language
    document.getElementById('languageBtn').addEventListener('click', () => {
        alert('Language settings coming soon!');
    });

    // Help & Support
    document.getElementById('helpBtn').addEventListener('click', () => {
        alert('Help & Support:\n\nEmail: support@digitalvendor.com\nPhone: 1-800-DIGITAL\n\nCommon issues are available in our Help Center.');
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
        if (confirm('Are you sure you want to logout?')) {
            await window.supabaseClient.auth.signOut();
            window.location.href = 'login-role.html';
        }
    });

    // Search button
    document.getElementById('searchBtn').addEventListener('click', () => {
        window.location.href = 'index.html';
    });
</script>
</body>
</html>
