<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.6"></script>
    <script src="js/supabase-client.js"></script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #fff8f4;
        }
    </style>
    <title>Orders - DigitalVendor</title>
</head>
<body class="font-['Be_Vietnam_Pro'] text-on-surface min-h-screen">
<header class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-md border-b border-stone-100 shadow-sm flex items-center justify-between px-5 h-16">
    <h1 class="text-xl font-extrabold tracking-tight text-orange-600 font-['Plus_Jakarta_Sans']">Orders</h1>
    <button class="w-10 h-10 flex items-center justify-center rounded-full text-stone-500 hover:bg-stone-50 transition-all active:scale-95">
        <span class="material-symbols-outlined">notifications</span>
    </button>
</header>

<main class="pt-20 pb-24 px-5 max-w-md mx-auto">
    <div id="ordersList" class="space-y-4"></div>

    <div id="emptyOrders" class="text-center py-12 hidden">
        <span class="material-symbols-outlined text-6xl text-stone-300 mb-4 block">receipt_long</span>
        <p class="text-stone-500 mb-4">No orders yet</p>
        <p class="text-stone-400 text-sm mb-6">Start shopping to see your orders here</p>
        <a href="index.html" class="inline-block px-6 py-3 bg-orange-600 text-white rounded-lg font-semibold hover:bg-orange-700 transition-colors">Browse Products</a>
    </div>
</main>

<nav class="fixed bottom-0 w-full z-50 rounded-t-2xl bg-white border-t border-stone-100 shadow-[0_-4px_12px_rgba(0,0,0,0.05)] flex justify-around items-center h-20 px-2">
    <a class="flex flex-col items-center justify-center text-stone-400 px-4 py-1 hover:text-orange-500 transition-colors active:scale-90 transition-transform duration-150" href="index.html">
        <span class="material-symbols-outlined">home</span>
        <span class="font-['Plus_Jakarta_Sans'] text-[11px] font-medium">Home</span>
    </a>
    <a class="flex flex-col items-center justify-center text-orange-600 bg-orange-50 rounded-xl px-4 py-1 active:scale-90 transition-transform duration-150" href="orders.html">
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">receipt_long</span>
        <span class="font-['Plus_Jakarta_Sans'] text-[11px] font-medium">Orders</span>
    </a>
    <a class="flex flex-col items-center justify-center text-stone-400 px-4 py-1 hover:text-orange-500 transition-colors active:scale-90 transition-transform duration-150" href="messages.html">
        <span class="material-symbols-outlined">forum</span>
        <span class="font-['Plus_Jakarta_Sans'] text-[11px] font-medium">Messages</span>
    </a>
    <a class="flex flex-col items-center justify-center text-stone-400 px-4 py-1 hover:text-orange-500 transition-colors active:scale-90 transition-transform duration-150" href="profile.html">
        <span class="material-symbols-outlined">person</span>
        <span class="font-['Plus_Jakarta_Sans'] text-[11px] font-medium">Profile</span>
    </a>
</nav>

<script>
    async function init() {
        const result = await requireSession();
        if (!result) return;

        const { data: orders, error } = await window.supabaseClient
            .from('orders')
            .select('*, order_items(*, products(name, icon))')
            .eq('buyer_id', result.session.user.id)
            .order('created_at', { ascending: false });

        const listEl = document.getElementById('ordersList');
        const emptyEl = document.getElementById('emptyOrders');

        if (error || !orders || orders.length === 0) {
            listEl.innerHTML = '';
            emptyEl.classList.remove('hidden');
            return;
        }

        emptyEl.classList.add('hidden');
        listEl.innerHTML = orders.map(order => `
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-stone-100">
                <div class="flex justify-between items-center mb-2">
                    <span class="font-semibold">${new Date(order.created_at).toLocaleDateString()}</span>
                    <span class="text-xs font-medium px-2 py-1 rounded-full bg-orange-50 text-orange-600 capitalize">${escapeHtml(order.status)}</span>
                </div>
                <ul class="text-sm text-stone-500 mb-2 space-y-1">
                    ${order.order_items.map(item => `<li>${escapeHtml(item.products?.icon || '🛍️')} ${escapeHtml(item.products?.name || 'Product')} × ${item.quantity}</li>`).join('')}
                </ul>
                <div class="text-right font-bold text-orange-600">$${Number(order.total).toFixed(2)}</div>
            </div>
        `).join('');
    }

    init();
</script>
</body>
</html>
