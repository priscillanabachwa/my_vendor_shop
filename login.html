    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #fff8f4;
        }
        .modern-tactile-shadow {
            box-shadow: 0 4px 12px rgba(140, 113, 102, 0.05);
        }

    <style>
        body {
          min-height: max(884px, 100dvh);
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 50;
            align-items: center;
            justify-content: center;
        }

            display: flex;

<body class="font-body-md text-on-surface selection:bg-primary-fixed">
<main class="min-h-screen flex flex-col items-center justify-center px-margin-mobile py-xl">
    <div class="w-full max-w-md flex flex-col items-center">
        <header class="mb-xl text-center">
            <div class="w-16 h-16 bg-primary-container rounded-2xl flex items-center justify-center mb-md mx-auto shadow-lg shadow-primary-container/20">
                <span class="material-symbols-outlined text-white text-4xl" data-icon="storefront">storefront</span>
            </div>
            <h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">DigitalVendor</h1>
            <p class="font-body-sm text-on-surface-variant mt-xs">Empowering local commerce, digitally.</p>
        </header>

        <!-- Alert Messages -->
        <div id="alertContainer" class="w-full mb-md"></div>

        <section class="w-full bg-white rounded-3xl p-lg modern-tactile-shadow border border-stone-100">
            <form id="loginForm" class="space-y-lg">
                <div class="space-y-xs">
                    <label class="font-label-lg text-on-surface-variant ml-1" for="identifier">Phone number or email</label>
                    <div class="relative group">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors" data-icon="person">person</span>
                        <input class="w-full h-[56px] pl-12 pr-4 bg-surface-container-low border-none rounded-xl font-body-lg text-on-surface focus:ring-2 focus:ring-primary-container transition-all" id="identifier" placeholder="Enter your details" type="text" required/>
                    </div>
                </div>
                <div class="space-y-xs">
                    <div class="flex justify-between items-center px-1">
                        <label class="font-label-lg text-on-surface-variant" for="password">Password</label>
                        <button class="font-label-md text-primary hover:underline" type="button" id="forgotPasswordBtn">Forgot Password?</button>
                    </div>
                    <div class="relative group">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors" data-icon="lock">lock</span>
                        <input class="w-full h-[56px] pl-12 pr-12 bg-surface-container-low border-none rounded-xl font-body-lg text-on-surface focus:ring-2 focus:ring-primary-container transition-all" id="password" placeholder="••••••••" type="password" required/>
                        <button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" id="togglePasswordBtn" type="button">
                            <span class="material-symbols-outlined" id="visibilityIcon" data-icon="visibility">visibility</span>
                        </button>
                    </div>
                </div>
                <button id="loginBtn" class="w-full h-[56px] bg-primary text-on-primary font-headline-md rounded-xl shadow-lg shadow-primary/20 active:scale-[0.98] transition-transform flex items-center justify-center gap-2 hover:bg-opacity-90" type="submit">
                    Login
                </button>
            </form>
            <div class="mt-lg flex items-center gap-md">
                <div class="h-[1px] flex-1 bg-outline-variant"></div>
                <span class="font-label-md text-outline">or continue with</span>
                <div class="h-[1px] flex-1 bg-outline-variant"></div>
            </div>
            <div class="mt-lg grid grid-cols-2 gap-md">
                <button id="googleBtn" class="flex items-center justify-center h-[52px] bg-surface-container-lowest border border-outline-variant rounded-xl hover:bg-surface-container-low transition-colors active:scale-95 duration-150" type="button">
                    <img alt="Google" class="w-6 h-6 mr-2" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCTGXXMNvXz5X7-jN4p0BJhjwFmoMk7dcxhv6AOT1XPfXSb-C7mZ99uAiNSMAhSigNGuU64OTjWEc-Iw7nV0p0v3fc7XuPpLqNucuUfnaX4mcyUtQ8jT6F0vjO9m_jIwjQoUPTCqXjP14dU_yelnsh1UoWiC2ccGZoMHoFRbrcYLH6DSuLcyLXmJwAJF7NIR5DR3e0rx3thaPbR7Axwdlq95NAfJmE1IgG6VegQ_MctUcybs--xUzrVdG3r7ftzsXR7NeEqxg5Xn1I"/>
                    <span class="font-label-lg text-on-surface">Google</span>
                </button>
                <button id="whatsappBtn" class="flex items-center justify-center h-[52px] bg-[#25D366]/10 border border-[#25D366]/20 rounded-xl hover:bg-[#25D366]/20 transition-colors active:scale-95 duration-150" type="button">
                    <span class="material-symbols-outlined text-[#128C7E] mr-2" data-icon="chat" style="font-variation-settings: 'FILL' 1;">chat</span>
                    <span class="font-label-lg text-[#075E54]">WhatsApp</span>
                </button>
            </div>

        <footer class="mt-xl text-center">
            <p class="font-body-sm text-on-surface-variant">
                New to DigitalVendor? 
                <a class="text-primary font-label-lg hover:underline ml-1" href="signup.html">Sign Up</a>
            </p>
        </footer>

</main>

<!-- Forgot Password Modal -->
<div id="forgotPasswordModal" class="modal">
    <div class="bg-white rounded-3xl p-lg w-full max-w-md mx-margin-mobile">
        <div class="flex justify-between items-center mb-lg">
            <h2 class="font-headline-md text-headline-md text-primary">Reset Password</h2>
            <button id="closeForgotPasswordBtn" type="button" class="text-on-surface-variant hover:text-on-surface">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <form id="forgotPasswordForm" class="space-y-lg">
            <div class="space-y-xs">
                <label class="font-label-lg text-on-surface-variant" for="resetEmail">Email Address</label>
                <input class="w-full h-[56px] px-4 bg-surface-container-low border-none rounded-xl font-body-lg text-on-surface focus:ring-2 focus:ring-primary-container transition-all" id="resetEmail" placeholder="Enter your email" type="email" required/>
            </div>
            <button class="w-full h-[56px] bg-primary text-on-primary font-headline-md rounded-xl shadow-lg shadow-primary/20 hover:bg-opacity-90 transition-all" type="submit">
                Send Reset Link
            </button>
        </form>
    </div>
</div>

<!-- Background Decorations -->
<div class="fixed top-0 left-0 w-full h-full pointer-events-none -z-10 opacity-40 overflow-hidden">
    <div class="absolute top-[-10%] right-[-10%] w-[50%] h-[50%] bg-primary-container rounded-full blur-[120px] opacity-20"></div>
    <div class="absolute bottom-[-5%] left-[-5%] w-[40%] h-[40%] bg-tertiary-container rounded-full blur-[100px] opacity-15"></div>
</div>

<script>
    // DEMO MODE - Works without Supabase connection
    let supabase = null;
    
    // Demo credentials (built-in)
    const DEMO_ACCOUNTS = {
        'demo@example.com': 'demo123',
        'test@test.com': 'test123',
        'user@digitalvendor.com': 'password123'
    };

    // Show Alert Message
    function showAlert(message, type = 'error') {
        const alertContainer = document.getElementById('alertContainer');
        const bgColor = type === 'success' ? 'bg-green-100' : 'bg-red-100';
        const textColor = type === 'success' ? 'text-green-800' : 'text-red-800';
        const borderColor = type === 'success' ? 'border-green-300' : 'border-red-300';
        
        const alert = document.createElement('div');
        alert.className = `${bgColor} ${textColor} ${borderColor} border rounded-xl p-md font-body-sm`;
        alert.textContent = message;
        
        alertContainer.innerHTML = '';
        alertContainer.appendChild(alert);
        
        setTimeout(() => {
            alert.remove();
        }, 5000);
    }

    // Password Visibility Toggle
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('password');
    const visibilityIcon = document.getElementById('visibilityIcon');

    togglePasswordBtn.addEventListener('click', (e) => {
        e.preventDefault();
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        visibilityIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
    });

    // Login Form Handler - DEMO MODE
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const identifier = document.getElementById('identifier').value;
        const password = document.getElementById('password').value;

        loginBtn.disabled = true;
        loginBtn.textContent = 'Logging in...';

        try {
            // Check demo accounts first
            let isValid = DEMO_ACCOUNTS[identifier] && DEMO_ACCOUNTS[identifier] === password;
            
            // Check custom signup accounts from localStorage
            if (!isValid) {
                const customAccounts = JSON.parse(localStorage.getItem('demoAccounts') || '{}');
                isValid = customAccounts[identifier] && customAccounts[identifier] === password;
            }
            
            if (isValid) {
                // Store user in localStorage for demo
                localStorage.setItem('demoUser', JSON.stringify({
                    email: identifier,
                    name: identifier.split('@')[0].toUpperCase(),
                    id: 'demo-' + Math.random().toString(36).substr(2, 9)
                }));
                
                showAlert('Login successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = 'home.html';
                }, 1000);
            } else {
                showAlert('Invalid credentials. Try: demo@example.com / demo123', 'error');
            }
        } catch (error) {
            showAlert(error.message || 'Login failed. Please try again.');
        } finally {
            loginBtn.disabled = false;
            loginBtn.textContent = 'Login';
        }
    });

    // Forgot Password Modal
    const forgotPasswordBtn = document.getElementById('forgotPasswordBtn');
    const forgotPasswordModal = document.getElementById('forgotPasswordModal');
    const closeForgotPasswordBtn = document.getElementById('closeForgotPasswordBtn');
    const forgotPasswordForm = document.getElementById('forgotPasswordForm');

    forgotPasswordBtn.addEventListener('click', (e) => {
        e.preventDefault();
        forgotPasswordModal.classList.add('active');
    });

    closeForgotPasswordBtn.addEventListener('click', () => {
        forgotPasswordModal.classList.remove('active');
    });

    forgotPasswordModal.addEventListener('click', (e) => {
        if (e.target === forgotPasswordModal) {
            forgotPasswordModal.classList.remove('active');
        }
    });

    forgotPasswordForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('resetEmail').value;
        const submitBtn = forgotPasswordForm.querySelector('button');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending...';

        try {
            // DEMO MODE: Just show success
            showAlert('Password reset link sent to your email! (Demo Mode)', 'success');
            forgotPasswordModal.classList.remove('active');
            forgotPasswordForm.reset();
        } catch (error) {
            showAlert(error.message || 'Failed to send reset link.');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Send Reset Link';
        }
    });

    // Google Login
    const googleBtn = document.getElementById('googleBtn');
    googleBtn.addEventListener('click', async () => {
        showAlert('Google login not available in demo mode. Use: demo@example.com / demo123', 'error');
    });

    // WhatsApp Login
    const whatsappBtn = document.getElementById('whatsappBtn');
    whatsappBtn.addEventListener('click', () => {
        showAlert('WhatsApp login is coming soon!', 'error');
        // Implementation would require WhatsApp Business API setup
    });
</script>
</body>
</html>
