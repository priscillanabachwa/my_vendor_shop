<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - DigitalVendor</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="css/theme.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.6"></script>
    <script src="js/supabase-client.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: linear-gradient(135deg, var(--color-primary-container) 0%, var(--color-primary) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 450px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .header h1 {
            font-family: var(--font-heading);
            font-size: 28px;
            color: var(--color-on-surface);
            font-weight: 800;
            margin-bottom: 10px;
        }

        .header p {
            color: var(--color-on-surface-variant);
            font-size: 14px;
        }

        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .role-card {
            padding: 20px;
            border: 2px solid var(--color-outline-variant);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            background: white;
        }

        .role-card:hover {
            border-color: var(--color-primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(160, 65, 0, 0.1);
        }

        .role-card.selected {
            background: linear-gradient(135deg, var(--color-primary-container) 0%, var(--color-primary) 100%);
            color: white;
            border-color: var(--color-primary);
        }

        .role-card .icon {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .role-card .title {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .role-card .description {
            font-size: 12px;
            opacity: 0.7;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--color-on-surface);
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--color-outline-variant);
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(160, 65, 0, 0.1);
        }

        .error-message {
            color: var(--color-error);
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .btn-signup {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--color-primary-container) 0%, var(--color-primary) 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 10px;
        }

        .btn-signup:hover {
            transform: translateY(-2px);
        }

        .btn-signup:active {
            transform: translateY(0);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
            color: var(--color-outline);
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--color-outline-variant);
        }

        .links {
            text-align: center;
            font-size: 13px;
            margin-top: 20px;
            color: var(--color-on-surface-variant);
        }

        .links a {
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 500;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .success-message {
            background: var(--color-tertiary);
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .terms {
            font-size: 12px;
            color: var(--color-outline);
            margin-top: 15px;
        }

        .terms a {
            color: var(--color-primary);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🏪</div>
            <h1>Join DigitalVendor</h1>
            <p>Choose your role and create an account</p>
        </div>

        <div class="role-selector">
            <div class="role-card" onclick="selectRole('buyer', event)">
                <div class="icon">🛍️</div>
                <div class="title">Buyer</div>
                <div class="description">Browse & purchase products</div>
            </div>
            <div class="role-card" onclick="selectRole('vendor', event)">
                <div class="icon">🏢</div>
                <div class="title">Vendor</div>
                <div class="description">Sell your products</div>
            </div>
        </div>

        <div class="success-message" id="successMessage"></div>

        <!-- Signup Form -->
        <form id="signupForm" onsubmit="handleSignup(event)">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="John Doe" required>
                <div class="error-message" id="nameError"></div>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required>
                <div class="error-message" id="emailError"></div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="At least 8 characters" required>
                <div class="error-message" id="passwordError"></div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Re-enter password" required>
                <div class="error-message" id="confirmError"></div>
            </div>

            <div class="terms">
                <input type="checkbox" id="terms" required>
                I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
            </div>

            <button type="submit" class="btn-signup">Create Account</button>
        </form>

        <div class="links">
            Already have an account? <a href="login-role.html">Sign In</a>
        </div>
    </div>

    <script>
        let selectedRole = null;

        function selectRole(role, event) {
            selectedRole = role;

            // Update UI
            document.querySelectorAll('.role-card').forEach(card => {
                card.classList.remove('selected');
            });
            event.target.closest('.role-card').classList.add('selected');
        }

        async function handleSignup(event) {
            event.preventDefault();

            if (!selectedRole) {
                showError('Please select a role (Buyer or Vendor)', 'email');
                return;
            }

            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validate
            if (!fullName || !email || !password || !confirmPassword) {
                showError('Please fill in all fields', 'email');
                return;
            }

            if (password.length < 8) {
                showError('Password must be at least 8 characters', 'password');
                return;
            }

            if (password !== confirmPassword) {
                showError('Passwords do not match', 'confirm');
                return;
            }

            if (!document.getElementById('terms').checked) {
                showError('You must agree to the terms', 'email');
                return;
            }

            const submitBtn = document.querySelector('.btn-signup');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating account...';

            const { data, error } = await window.supabaseClient.auth.signUp({
                email,
                password,
                options: {
                    data: { full_name: fullName, role: selectedRole }
                }
            });

            submitBtn.disabled = false;
            submitBtn.textContent = 'Create Account';

            if (error) {
                showError(error.message, 'email');
                return;
            }

            if (!data.session) {
                showSuccess('Account created! Check your email to confirm, then sign in.');
                setTimeout(() => { window.location.href = 'login-role.html'; }, 2000);
                return;
            }

            showSuccess('Account created successfully! Redirecting...');
            setTimeout(() => {
                window.location.href = selectedRole === 'vendor' ? 'vendor-dashboard.html' : 'index.html';
            }, 1500);
        }

        function showError(message, field) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message show';
            errorDiv.textContent = message;
            document.querySelector('.container').insertBefore(errorDiv, document.getElementById('signupForm'));
            setTimeout(() => errorDiv.remove(), 3000);
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.classList.add('show');
        }

        // If already logged in, skip straight to the right dashboard
        window.addEventListener('load', async () => {
            const { data: { session } } = await window.supabaseClient.auth.getSession();
            if (session) {
                const { data: profile } = await window.supabaseClient
                    .from('profiles')
                    .select('role')
                    .eq('id', session.user.id)
                    .single();
                window.location.href = profile && profile.role === 'vendor' ? 'vendor-dashboard.html' : 'index.html';
            }
        });
    </script>
</body>
</html>
