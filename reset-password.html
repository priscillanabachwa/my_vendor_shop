<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Reset Password - DigitalVendor</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.6"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/tailwind-config.js"></script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #fff8f4;
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="font-body-md text-on-surface selection:bg-primary-fixed">
<main class="min-h-screen flex flex-col items-center justify-center px-5 py-8">
    <div class="w-full max-w-md flex flex-col items-center">
        <header class="mb-8 text-center">
            <div class="w-16 h-16 bg-primary-container rounded-2xl flex items-center justify-center mb-4 mx-auto shadow-lg">
                <span class="material-symbols-outlined text-white text-4xl">lock_reset</span>
            </div>
            <h1 class="text-2xl font-bold text-primary tracking-tight">Reset Password</h1>
            <p class="text-sm text-on-surface-variant mt-2">Create a new password for your account</p>
        </header>

        <div id="alertContainer" class="w-full mb-4"></div>

        <section class="w-full bg-white rounded-3xl p-6 border border-stone-100 shadow-sm">
            <form id="resetPasswordForm" class="space-y-6">
                <div class="space-y-2">
                    <label class="text-sm font-semibold text-on-surface-variant" for="newPassword">New Password</label>
                    <input class="w-full h-14 px-4 bg-surface-container-low border-none rounded-xl font-base text-on-surface focus:ring-2 focus:ring-primary-container transition-all" id="newPassword" placeholder="••••••••" type="password" required/>
                </div>
                <div class="space-y-2">
                    <label class="text-sm font-semibold text-on-surface-variant" for="confirmNewPassword">Confirm Password</label>
                    <input class="w-full h-14 px-4 bg-surface-container-low border-none rounded-xl font-base text-on-surface focus:ring-2 focus:ring-primary-container transition-all" id="confirmNewPassword" placeholder="••••••••" type="password" required/>
                </div>
                <button class="w-full h-14 bg-primary text-white font-bold rounded-xl shadow-lg hover:bg-opacity-90 transition-all" type="submit">
                    Reset Password
                </button>
            </form>
        </section>

        <footer class="mt-8 text-center">
            <p class="text-sm text-on-surface-variant">
                Remember your password?
                <a class="text-primary font-semibold hover:underline ml-1" href="login-role.html">Login</a>
            </p>
        </footer>
    </div>
</main>

<script>
    function showAlert(message, type = 'error') {
        const alertContainer = document.getElementById('alertContainer');
        const bgColor = type === 'success' ? 'bg-tertiary-container/20' : 'bg-error-container';
        const textColor = type === 'success' ? 'text-tertiary' : 'text-error';
        const borderColor = type === 'success' ? 'border-tertiary-container' : 'border-error-container';
        
        const alert = document.createElement('div');
        alert.className = `${bgColor} ${textColor} ${borderColor} border rounded-xl p-4 text-sm`;
        alert.textContent = message;
        
        alertContainer.innerHTML = '';
        alertContainer.appendChild(alert);
        
        setTimeout(() => {
            alert.remove();
        }, 5000);
    }

    const resetPasswordForm = document.getElementById('resetPasswordForm');
    resetPasswordForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const newPassword = document.getElementById('newPassword').value;
        const confirmNewPassword = document.getElementById('confirmNewPassword').value;

        if (newPassword !== confirmNewPassword) {
            showAlert('Passwords do not match!');
            return;
        }

        if (newPassword.length < 6) {
            showAlert('Password must be at least 6 characters long!');
            return;
        }

        const submitBtn = resetPasswordForm.querySelector('button');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Resetting...';

        try {
            const { error } = await window.supabaseClient.auth.updateUser({
                password: newPassword
            });

            if (error) throw error;

            showAlert('Password reset successfully! Redirecting to login...', 'success');
            setTimeout(() => {
                window.location.href = 'login-role.html';
            }, 2000);
        } catch (error) {
            showAlert(error.message || 'Failed to reset password.');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Reset Password';
        }
    });
</script>
</body>
</html>
