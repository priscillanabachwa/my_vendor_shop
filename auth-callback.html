<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Authenticating - DigitalVendor</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.6"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/tailwind-config.js"></script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #fff8f4;
            min-height: 100dvh;
        }
        .spinner {
            border: 4px solid #faf2ed;
            border-top: 4px solid #a04100;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="font-body-md text-on-surface selection:bg-primary-fixed">
<main class="min-h-screen flex flex-col items-center justify-center px-5">
    <div class="text-center">
        <div class="mb-6 flex justify-center">
            <div class="spinner"></div>
        </div>
        <h1 class="text-2xl font-bold text-primary mb-2">Authenticating...</h1>
        <p class="text-sm text-on-surface-variant">Please wait while we complete your login.</p>
    </div>
</main>

<script>
    let redirected = false;

    const { data: { subscription } } = window.supabaseClient.auth.onAuthStateChange((event, session) => {
        if (redirected) return;
        if (session) {
            redirected = true;
            subscription.unsubscribe();
            clearTimeout(fallbackTimer);
            window.location.href = 'index.html';
        } else if (event === 'SIGNED_OUT') {
            redirected = true;
            subscription.unsubscribe();
            clearTimeout(fallbackTimer);
            window.location.href = 'login-role.html';
        }
    });

    // Fallback: redirect after 5 seconds if no auth state change fires
    const fallbackTimer = setTimeout(() => {
        if (!redirected) window.location.href = 'login-role.html';
    }, 5000);
</script>
</body>
</html>
